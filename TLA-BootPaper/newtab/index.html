<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: chrome-extension://bemjdlnfdfdgnkimadgogaadgdfnipam extension://bemjdlnfdfdgnkimadgogaadgdfnipam; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; form-action https:; base-uri 'none'">
<title>New tab</title>
<link rel="icon" href="icon.png">
<!--
  The TLA new tab page (TLA BootPaper 5.0). Edge and Chrome open it for new tabs on TLA computers (a browser policy,
  NewTabPageLocation). It shows today's TLA background (the seasonal theme in season, otherwise a different one each
  day, in its dark look when the computer is in dark mode), the time, the TLA announcement (../linux/announcement.txt)
  and the links in links.json. Nothing is sent anywhere: it only reads files next to it.
  5.4: each person's own shortcuts (Add shortcut, edit, remove; kept in their browser), and, where the TLA New Tab
  extension is installed (../extension/), the browser's most-visited sites, like Chrome's and Edge's own new tab page.
  6.3: the TLA Hub button in the search bar, Microsoft 365's and Google's apps in a menu each (bottom left and right),
  the shortcuts alone at the bottom, and the person's own desktop background (from TLA BootPaper, through the extension)
  instead of today's.
-->
<style>
  :root {
    --navy: #0B1B33;
    --gold: #F2B830;
    --white: #FFFFFF;
    --ink-soft: rgba(11, 27, 51, 0.72);
    --glass: rgba(11, 27, 51, 0.46);
    --glass-edge: rgba(255, 255, 255, 0.18);
    --type: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "SF Pro Text", Ubuntu, Cantarell, "Noto Sans", sans-serif;
    --type-display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "SF Pro Display", Ubuntu, Cantarell, "Noto Sans", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--navy); color: var(--white); font-family: var(--type); -webkit-font-smoothing: antialiased; }

  .picture { position: fixed; inset: 0; background: var(--navy) center / cover no-repeat; opacity: 0; transition: opacity 600ms ease-out; }
  .picture.shown { opacity: 1; }
  /* Darker at the top and bottom, where the words are; the middle (the TLA logo in every picture) stays clear. */
  .scrim { position: fixed; inset: 0; pointer-events: none;
           background: linear-gradient(to bottom, rgba(8, 20, 38, 0.62) 0%, rgba(8, 20, 38, 0.18) 30%, rgba(8, 20, 38, 0) 45%,
                                       rgba(8, 20, 38, 0) 62%, rgba(8, 20, 38, 0.55) 100%); }

  main { position: relative; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto;
         padding: clamp(20px, 3.5vw, 44px); gap: 12px; }

  /* The top band: the time, search and the announcement. The middle (the TLA logo in every picture) stays clear. */
  header { display: grid; grid-template-columns: max-content minmax(280px, 1fr) minmax(220px, 380px); align-items: start; gap: 28px; }
  .notice { justify-self: end; }
  .time { margin: 0; font-family: var(--type-display); font-weight: 300; font-size: clamp(52px, 6.4vw, 96px); white-space: nowrap;
          line-height: 0.95; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; text-shadow: 0 2px 18px rgba(8, 20, 38, 0.45); }
  .hello { margin: 10px 0 0 4px; font-size: clamp(16px, 1.6vw, 20px); font-weight: 500; text-shadow: 0 1px 8px rgba(8, 20, 38, 0.6); }

  .notice { max-width: 380px; padding: 12px 16px 13px; border-radius: 10px; border-left: 3px solid var(--gold);
            background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3);
            font-size: 15px; line-height: 1.45; }
  .notice strong { display: block; color: var(--gold); font-size: 14px; margin-bottom: 2px; }
  .notice[hidden] { display: none; }

  form { justify-self: center; width: min(560px, 100%); margin-top: clamp(14px, 1.8vw, 26px); position: relative; }
  form svg { position: absolute; left: 19px; top: 50%; translate: 0 -50%; width: 20px; height: 20px; stroke: var(--ink-soft); }
  input[type=search] { width: 100%; height: 54px; padding: 0 64px 0 52px; border: 0; border-radius: 27px;
                       background: rgba(255, 255, 255, 0.94); color: var(--navy); font: 17px var(--type);
                       box-shadow: 0 10px 34px rgba(8, 20, 38, 0.35); }
  input[type=search]::placeholder { color: var(--ink-soft); }
  input[type=search]::-webkit-search-cancel-button { display: none; }
  /* 6.3: the TLA Hub, in its own circle at the far end of the search bar (where the magnifying glass is at the start). */
  .hub { position: absolute; right: 3px; top: 50%; translate: 0 -50%; display: grid; place-items: center; align-content: center;
         gap: 2px; width: 48px; height: 48px; border-radius: 50%; background: var(--navy); color: var(--gold); text-decoration: none;
         box-shadow: 0 0 0 2px rgba(242, 184, 48, 0.85); }
  .hub svg { position: static; translate: none; width: 20px; height: 20px; stroke: var(--gold); }
  .hub span { font: 600 8.5px/1 var(--type); letter-spacing: 0.01em; color: var(--white); white-space: nowrap; }
  .hub:hover { background: #13294A; }
  .hub:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  input[type=search]:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  /* 6.3: the bottom row: Microsoft 365's apps (left), the shortcuts (middle), Google's apps (right). */
  .bottom { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 20px; padding-bottom: 22px; }
  .suite { position: relative; }
  .suite.ms { justify-self: start; }
  .suite.google { justify-self: end; }
  .suite > button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; width: 132px; height: 132px;
         padding: 0; border-radius: 22px; border: 1px solid var(--glass-edge); background: var(--glass); color: var(--white); cursor: pointer;
         -webkit-backdrop-filter: blur(20px) saturate(1.3); backdrop-filter: blur(20px) saturate(1.3); font: 600 14px/1.2 var(--type); }
  .suite > button:hover { background: rgba(11, 27, 51, 0.62); }
  .suite > button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .dots { display: grid; grid-template-columns: repeat(3, 12px); gap: 7px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; }
  .chev { position: absolute; top: 9px; right: 9px; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;
          border: 1px solid rgba(255, 255, 255, 0.45); transition: rotate 160ms ease-out; }
  .chev svg { width: 13px; height: 13px; stroke: var(--white); stroke-width: 2.2; }
  .suite > button[aria-expanded=true] .chev { rotate: 180deg; }
  .menu { position: absolute; bottom: calc(100% + 10px); width: 330px; padding: 14px 10px 10px; border-radius: 20px;
          border: 1px solid var(--glass-edge); background: rgba(11, 27, 51, 0.82); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.4);
          -webkit-backdrop-filter: blur(24px) saturate(1.4); backdrop-filter: blur(24px) saturate(1.4); }
  .ms .menu { left: 0; }
  .google .menu { right: 0; }
  .menu[hidden] { display: none; }
  .menu h2 { margin: 0 8px 8px; font: 600 13px var(--type); color: var(--gold); letter-spacing: 0.02em; }
  .menu .apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
  .menu a { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 10px 4px 9px; border-radius: 12px;
            color: var(--white); text-decoration: none; font-size: 13px; line-height: 1.2; text-align: center; }
  .menu a:hover { background: rgba(255, 255, 255, 0.12); }
  .menu a:focus-visible { outline: 3px solid var(--gold); outline-offset: 0; }
  .app { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 11px; background: var(--c, #2B579A); }
  .app svg { width: 22px; height: 22px; stroke: #fff; }

  /* 5.4: the person's shortcuts (and the browser's most-visited sites), like Chrome's and Edge's own tiles. */
  .shortcuts { justify-self: center; display: flex; flex-direction: column; max-width: min(100%, 1010px);
               padding: 10px 12px 6px; border-radius: 20px; border: 1px solid var(--glass-edge); background: var(--glass);
               -webkit-backdrop-filter: blur(20px) saturate(1.3); backdrop-filter: blur(20px) saturate(1.3); }
  .shortcuts h2 { display: flex; align-items: center; gap: 9px; margin: 0 6px 6px; padding-bottom: 9px;
                  border-bottom: 1px solid rgba(255, 255, 255, 0.16); font: 600 15px var(--type); }
  .shortcuts h2 svg { width: 19px; height: 19px; stroke: var(--white); }
  .shortcuts .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; }
  .tile { position: relative; width: 96px; }
  .tile > a, .tile > button.add { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; padding: 8px 4px 6px;
          border: 0; border-radius: 14px; background: none; color: var(--white); text-decoration: none; font: 13px/1.2 var(--type);
          text-align: center; cursor: pointer; }
  .tile > a:hover, .tile > button.add:hover { background: rgba(255, 255, 255, 0.12); }
  .tile > a:focus-visible, .tile > button:focus-visible { outline: 3px solid var(--gold); outline-offset: 0; }
  .tile .label { display: block; width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .fav { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, 0.94);
         color: var(--navy); font: 600 18px var(--type); }
  .fav img { width: 22px; height: 22px; }
  .add .fav { background: rgba(255, 255, 255, 0.14); color: var(--white); border: 1.5px dashed rgba(255, 255, 255, 0.55); font-weight: 400; font-size: 24px; }
  .tile .more { position: absolute; top: 2px; right: 6px; width: 26px; height: 26px; border: 0; border-radius: 50%; padding: 0;
                background: rgba(11, 27, 51, 0.75); color: var(--white); font: 600 15px/26px var(--type); cursor: pointer; opacity: 0; }
  .tile:hover .more, .tile:focus-within .more { opacity: 1; }
  .shortcuts[hidden] { display: none; }

  dialog { width: min(420px, calc(100vw - 32px)); padding: 22px 22px 18px; border: 1px solid var(--glass-edge); border-radius: 16px;
           background: #13294A; color: var(--white); font-family: var(--type); box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45); }
  dialog::backdrop { background: rgba(8, 20, 38, 0.55); }
  dialog h2 { margin: 0 0 14px; font: 600 18px var(--type-display); }
  dialog label { display: block; margin: 0 0 12px; font-size: 13px; }
  dialog input { display: block; width: 100%; margin-top: 5px; height: 38px; padding: 0 12px; border: 1px solid rgba(255, 255, 255, 0.25);
                 border-radius: 9px; background: rgba(255, 255, 255, 0.96); color: var(--navy); font: 15px var(--type); }
  dialog input:focus-visible { outline: 3px solid var(--gold); outline-offset: 1px; }
  dialog .error { min-height: 18px; margin: -4px 0 8px; color: #FFD27A; font-size: 13px; }
  dialog .buttons { display: flex; gap: 8px; margin-top: 6px; }
  dialog button { height: 36px; padding: 0 16px; border-radius: 9px; border: 1px solid rgba(255, 255, 255, 0.3); background: none;
                  color: var(--white); font: 600 14px var(--type); cursor: pointer; }
  dialog button.primary { background: var(--gold); border-color: var(--gold); color: var(--navy); }
  dialog button.remove { margin-right: auto; }
  dialog button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  .caption { position: fixed; right: clamp(14px, 2vw, 24px); bottom: 10px; margin: 0; font-size: 12px; opacity: 0.8;
             text-shadow: 0 1px 6px rgba(8, 20, 38, 0.8); }

  svg { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  @media (max-width: 1120px) {
    header { grid-template-columns: max-content minmax(0, 1fr); }
    form { grid-column: 1 / -1; grid-row: 2; justify-self: center; width: min(600px, 100%); margin-top: 0; }
  }
  @media (max-width: 1100px) {
    .bottom { grid-template-columns: 1fr 1fr; }
    .shortcuts { grid-column: 1 / -1; grid-row: 1; }
  }
  @media (max-width: 640px) {
    header { grid-template-columns: 1fr; }
    .suite > button { width: 112px; height: 112px; }
    .notice { justify-self: stretch; max-width: none; }
    form { grid-row: auto; }
    .tile { width: 84px; }
    .caption { position: static; text-align: center; }
  }
  @media (prefers-reduced-motion: reduce) { .picture { transition: none; } }
</style>
</head>
<body>
<div class="picture" id="picture" role="img" aria-label="Today's TLA background"></div>
<div class="scrim"></div>
<main>
  <header>
    <div>
      <p class="time" id="time">&nbsp;</p>
      <p class="hello" id="hello">&nbsp;</p>
    </div>
    <form id="search" role="search" method="get" action="https://www.bing.com/search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input type="search" name="q" id="q" placeholder="Search the web" aria-label="Search the web" autocomplete="off">
      <input type="hidden" name="adlt" value="strict">
      <a class="hub" id="hub" href="https://hub.schoolathome.ca/" title="TLA Hub" aria-label="TLA Hub">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 4l9 6.5"/><path d="M5.5 9v10h13V9"/><path d="M10 19v-5h4v5"/></svg>
        <span aria-hidden="true">TLA Hub</span>
      </a>
    </form>
    <aside class="notice" id="notice" hidden><strong>From TLA</strong><span id="notice-text"></span></aside>
  </header>
  <div></div>
  <div class="bottom">
    <div class="suite ms" id="suite-ms"></div>
    <section class="shortcuts" id="shortcuts" aria-labelledby="shortcuts-title" hidden>
      <h2 id="shortcuts-title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4 4.5v3.7h3.7"/><path d="M12 8v4.3l2.8 1.7"/></svg>Most visited</h2>
      <div class="row" id="shortcut-row"></div>
    </section>
    <div class="suite google" id="suite-google"></div>
  </div>
</main>
<dialog id="edit" aria-labelledby="edit-title">
  <form method="dialog" id="edit-form" novalidate>
    <h2 id="edit-title">Add shortcut</h2>
    <label>Name<input id="edit-name" maxlength="40" autocomplete="off"></label>
    <label>URL<input id="edit-url" maxlength="2000" autocomplete="off" inputmode="url" placeholder="example.com"></label>
    <p class="error" id="edit-error" role="alert"></p>
    <div class="buttons">
      <button type="button" class="remove" id="edit-remove">Remove</button>
      <button type="button" id="edit-cancel">Cancel</button>
      <button type="submit" class="primary" id="edit-save">Done</button>
    </div>
  </form>
</dialog>
<p class="caption" id="caption"></p>

<script>
'use strict';
// The same backgrounds and light/dark pictures as TLA BootPaper. VARIANTS: the look of each background's extra picture.
const BACKGROUNDS = [['microsoft', 'Microsoft'], ['liquid-glass', 'Liquid Glass'], ['penguins', 'Penguins'], ['code', 'Code'],
  ['frutiger-aero', 'Frutiger Aero'], ['solarpunk', 'Solarpunk'], ['rainy', 'Rainy'], ['space', 'Space'], ['ocean', 'Underwater'],
  ['beach', 'Beach'], ['vancouver', 'Vancouver'], ['claymation', 'Claymation'], ['blocks', 'Blocks'], ['bricks', 'Bricks'], ['pixel', '8-Bit'], ['anime', 'Anime'],
  ['sky-city', 'Sky City'], ['grumpy-cat', 'Grumpy Cat'], ['bonjovi', 'Bonjovi'], ['raccoon', 'Jimothy'], ['tla', 'TLA Classic']];
// (Beach, 5.4: added once 5.4 was Stable, since this page can't tell who's on Experimental. 5.9.0: SINCE instead: a
// background in it is left out until its release is Stable, as channels.json on this site says.)
const SINCE = { 'grumpy-cat': '5.9.0', bonjovi: '5.9.0', raccoon: '5.9.0', vancouver: '6.4.5' };
const SEASONS = { fall: 'Fall', christmas: 'Christmas', easter: 'Easter', winter: 'Winter' };
const OTHER_NAMES = { experimental: 'Battle of the Beta Testers' };   // (6.3: shown when it's their desktop's)
const VARIANTS = { microsoft: 'dark', 'liquid-glass': 'dark', 'frutiger-aero': 'dark', solarpunk: 'dark', rainy: 'dark',
  claymation: 'dark', blocks: 'dark', bricks: 'dark', pixel: 'dark', anime: 'dark', 'sky-city': 'dark', tla: 'dark',
  penguins: 'light', code: 'light', space: 'light', ocean: 'dark', beach: 'dark', fall: 'dark', christmas: 'dark', easter: 'dark',
  'grumpy-cat': 'dark', bonjovi: 'dark', raccoon: 'dark', vancouver: 'dark', winter: 'dark' };
// 6.3: hub (the button in the search bar), and the apps in the Microsoft 365 and Google menus. links.json can change them.
const DEFAULT_LINKS = {
  search: { placeholder: 'Search the web', action: 'https://www.bing.com/search', params: { adlt: 'strict' } },
  hub: 'https://hub.schoolathome.ca/',
  microsoft: [
    { name: 'Outlook', url: 'https://outlook.office.com/mail/', icon: 'mail', color: '#0F6CBD' },
    { name: 'Teams', url: 'https://teams.microsoft.com/', icon: 'chat', color: '#5B5FC7' },

    { name: 'Sheets', url: 'https://docs.google.com/spreadsheets/', icon: 'sheet', color: '#188038' },

    { name: 'Classroom', url: 'https://classroom.google.com/', icon: 'class', color: '#1E8E3E' }]
};
// (the coloured dots of each menu's button)
const DOTS = { microsoft: ['#F25022', '#7FBA00', '#00A4EF', '#FFB900', '#F25022', '#7FBA00', '#00A4EF', '#FFB900', '#F25022'],
               google: ['#4285F4', '#EA4335', '#FBBC05', '#34A853', '#4285F4', '#EA4335', '#FBBC05', '#34A853', '#4285F4'] };
const ICONS = {
  hub: '<path d="M3 10.5 12 4l9 6.5"/><path d="M5.5 9v10h13V9"/><path d="M10 19v-5h4v5"/>',
  mail: '<rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="m3.5 7 8.5 6 8.5-6"/>',
  chat: '<path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H10l-5 4v-4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/>',
  cloud: '<path d="M7.5 18.5h9.5a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.2 9.6a4.5 4.5 0 0 0 1.3 8.9z"/>',
  apps: '<rect x="4" y="4" width="6" height="6" rx="1.2"/><rect x="14" y="4" width="6" height="6" rx="1.2"/><rect x="4" y="14" width="6" height="6" rx="1.2"/><rect x="14" y="14" width="6" height="6" rx="1.2"/>',
  help: '<circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.4"/><path d="M12 17h.01"/>',
  book: '<path d="M5 4.5h12.5v15H6.5A1.5 1.5 0 0 1 5 18z"/><path d="M5 18a1.5 1.5 0 0 1 1.5-1.5h11"/>',

  link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'

// ---- today's picture ----
function easterSunday(y) {   // (the Anonymous Gregorian algorithm, as in TLA BootPaper)
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, g = Math.floor((8 * b + 13) / 25);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 19 * l) / 433), month = Math.floor((h + l - 7 * m + 90) / 25);
  return new Date(y, month - 1, (h + l - 7 * m + 33 * month + 19) % 32);
}
function season(d) {   // Fall Sep 22 - Nov 30, Christmas Dec 1 - Jan 6, Easter two weeks before Easter Sunday to Easter Monday, Winter Jan 7 - Mar 19
  const mo = d.getMonth() + 1, day = d.getDate();
  if ((mo === 9 && day >= 22) || mo === 10 || mo === 11) return 'fall';
  if (mo === 12 || (mo === 1 && day <= 6)) return 'christmas';
  const e = easterSunday(d.getFullYear()), t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  if (t >= new Date(e.getFullYear(), e.getMonth(), e.getDate() - 14) && t <= new Date(e.getFullYear(), e.getMonth(), e.getDate() + 1)) return 'easter';
  if ((mo === 1 && day >= 7) || mo === 2 || (mo === 3 && day <= 19)) return 'winter';   // (6.4.5)
  return null;
}
// The Stable release (from channels.json; until it's read, or if it can't be, anything with a SINCE is left out).
// (remembered from last time, so the picture doesn't change as the page opens)
let stableRelease = '';
try { stableRelease = localStorage.getItem('tla-stable') || ''; } catch (e) { /* (not available) */ }
const vkey = v => (String(v).match(/^\d+(\.\d+)*$/) ? (String(v) + '.0.0.0').split('.').slice(0, 4).map(Number) : null);
function onStable(id) {
  const a = vkey(SINCE[id] || '0'), b = vkey(stableRelease);
  if (!SINCE[id]) return true;
  if (!b) return false;
  for (let i = 0; i < 4; i++) if (a[i] !== b[i]) return a[i] < b[i];
  return true;
}
// 6.3: their desktop's background, as TLA BootPaper tells the TLA New Tab extension (remembered, so it's there at once).
let desk = null;
try { desk = JSON.parse(localStorage.getItem('tla-desk') || 'null'); } catch (e) { }
function backgroundName(id) {
  const b = BACKGROUNDS.find(([x]) => x === id);
  return b ? b[1] : SEASONS[id] ? SEASONS[id] + ' theme' : OTHER_NAMES[id] || '';
}
function todaysBackground(d) {
  if (desk && typeof desk.id === 'string' && backgroundName(desk.id)) return [desk.id, backgroundName(desk.id)];
  const s = season(d);
  if (s) return [s, SEASONS[s] + ' theme'];
  const dayNumber = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  const out = BACKGROUNDS.filter(([id]) => onStable(id));
  return out[dayNumber % out.length];
}
fetch('../channels.json', { cache: 'no-cache' }).then(r => r.json()).then(j => {
  if (!j || !vkey(j.stable) || j.stable === stableRelease) return;
  stableRelease = j.stable;
  try { localStorage.setItem('tla-stable', j.stable); } catch (e) { /* (not available) */ }
  showPicture();
}).catch(() => {});
const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
function pictureFile(id) {
  const look = desk && desk.id === id && (desk.look === 'dark' || desk.look === 'light') ? desk.look : darkQuery.matches ? 'dark' : 'light';
  return 'pictures/' + (VARIANTS[id] === look ? id + '-' + look : id) + '.jpg';
}
let shownFile = '';
function showPicture() {
  const [id, name] = todaysBackground(new Date());
  const file = pictureFile(id);
  if (file === shownFile) return;
  const img = new Image();
  img.onload = () => {
    const el = document.getElementById('picture');
    el.style.backgroundImage = 'url("' + file + '")';
    el.classList.add('shown');
    shownFile = file;
    document.getElementById('caption').textContent = (desk && desk.id === id ? 'Your background: ' : "Today's picture: ") + name;
  };
  img.onerror = () => { if (id !== 'tla') { shownFile = file; document.getElementById('picture').style.backgroundImage = 'url("pictures/tla.jpg")';
                                            document.getElementById('picture').classList.add('shown'); } };
  img.src = file;
}
darkQuery.addEventListener('change', showPicture);

// ---- the time ----
function tick() {
  const now = new Date(), h = now.getHours();
  document.getElementById('time').textContent = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const part = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  document.getElementById('hello').textContent = part + '! It’s ' +
    now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' }) + '.';
  showPicture();   // (a new day brings a new picture)
  setTimeout(tick, 60000 - now.getSeconds() * 1000 - now.getMilliseconds() + 50);
}

// ---- the announcement (the same text as on the Linux login screen) ----
function cleanAnnouncement(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l && !l.startsWith('#'));
  return Array.from(lines.join(' ')).filter(c => c >= ' ').join('').slice(0, 300).trim();
}
fetch('../linux/announcement.txt', { cache: 'no-cache' })
  .then(r => r.ok ? r.text() : '')
  .then(t => { const a = cleanAnnouncement(t || ''); if (a) { document.getElementById('notice-text').textContent = a; document.getElementById('notice').hidden = false; } })
  .catch(() => {});

// ---- links and search ----
const safeUrl = u => typeof u === 'string' && /^(https:\/\/|mailto:)/i.test(u);
function appList(list, fallback) {
  return (Array.isArray(list) ? list : fallback).filter(l => l && typeof l.name === 'string' && safeUrl(l.url)).slice(0, 12);
}
function showSuite(id, title, list, dots) {
  const box = document.getElementById('suite-' + id);
  const wasOpen = !!box.querySelector('.menu:not([hidden])');
  box.textContent = '';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.setAttribute('aria-expanded', 'false');
  btn.setAttribute('aria-controls', 'menu-' + id);
  const grid = document.createElement('span');
  grid.className = 'dots'; grid.setAttribute('aria-hidden', 'true');
  dots.forEach(c => { const i = document.createElement('i'); i.style.background = c; grid.append(i); });
  const chev = document.createElement('span');
  chev.className = 'chev'; chev.setAttribute('aria-hidden', 'true');
  chev.innerHTML = '<svg viewBox="0 0 24 24"><path d="m6 9.5 6 6 6-6"/></svg>';
  const name = document.createElement('span');
  name.textContent = title;
  btn.append(chev, grid, name);
  const menu = document.createElement('div');
  menu.className = 'menu'; menu.id = 'menu-' + id; menu.hidden = true;
  menu.setAttribute('role', 'group'); menu.setAttribute('aria-label', title + ' apps');
  const h = document.createElement('h2'); h.textContent = title;
  const apps = document.createElement('div'); apps.className = 'apps';
  list.forEach(l => {
    const a = document.createElement('a');
    a.href = l.url;
    const ic = document.createElement('span');
    ic.className = 'app';
    if (typeof l.color === 'string' && /^#[0-9a-f]{6}$/i.test(l.color)) ic.style.setProperty('--c', l.color);
    ic.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[l.icon] || ICONS.link) + '</svg>';   // (built-in icons only)
    const n = document.createElement('span');
    n.textContent = l.name.slice(0, 24);
    a.append(ic, n);
    apps.append(a);
  });
  menu.append(h, apps);
  btn.addEventListener('click', () => setMenu(id, menu.hidden));
  box.append(menu, btn);
  if (wasOpen) setMenu(id, true);
}
function setMenu(id, open) {
  for (const other of ['ms', 'google']) {
    const box = document.getElementById('suite-' + other);
    const menu = box.querySelector('.menu'), btn = box.querySelector('button');
    if (!menu) continue;
    const show = other === id && open;
    menu.hidden = !show; btn.setAttribute('aria-expanded', String(show));
  }
}
document.addEventListener('click', e => { if (!e.target.closest('.suite')) setMenu('', false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !dlg.open) setMenu('', false); });
function showLinks(cfg) {
  showSuite('ms', 'Microsoft 365', appList(cfg.microsoft, DEFAULT_LINKS.microsoft), DOTS.microsoft);
  showSuite('google', 'Google', appList(cfg.google, DEFAULT_LINKS.google), DOTS.google);
  if (typeof cfg.hub === 'string' && /^https:\/\//i.test(cfg.hub)) document.getElementById('hub').href = cfg.hub;
  const s = cfg.search || {};
  const form = document.getElementById('search');
  if (safeUrl(s.action) && s.action.startsWith('https://')) {
    form.action = s.action;
    form.querySelectorAll('input[type=hidden]').forEach(i => i.remove());
    Object.entries(s.params || {}).forEach(([k, v]) => {
      const i = document.createElement('input');
      i.type = 'hidden'; i.name = String(k); i.value = String(v);
      form.append(i);
    });
  }
  if (typeof s.placeholder === 'string') {
    document.getElementById('q').placeholder = s.placeholder;
    document.getElementById('q').setAttribute('aria-label', s.placeholder);
  }
}
showLinks(DEFAULT_LINKS);
fetch('links.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).then(c => c && showLinks(c)).catch(() => {});

// ---- the person's shortcuts (5.4) ----
// Their own (Add shortcut), kept in this browser only, and then the browser's most-visited sites when the TLA New Tab
// extension is installed (it's the only way a web page can get them). At most 10 tiles, like Chrome's and Edge's.
const EXTENSION_ID = 'bemjdlnfdfdgnkimadgogaadgdfnipam';
const STORE_KEY = 'tla-newtab-shortcuts';
const MAX_TILES = 10;
let store = { mine: [], hidden: [] };
let mostVisited = [], iconBase = '';
try {
  const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
  if (s && Array.isArray(s.mine)) store.mine = s.mine.filter(x => x && typeof x.name === 'string' && webUrl(x.url)).slice(0, MAX_TILES);
  if (s && Array.isArray(s.hidden)) store.hidden = s.hidden.filter(u => typeof u === 'string').slice(0, 200);
} catch (e) { }
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { } }
function webUrl(u) { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; } catch (e) { return null; } }
function sameSite(a, b) { return a.replace(/\/+$/, '').toLowerCase() === b.replace(/\/+$/, '').toLowerCase(); }
function hostName(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } }

function tiles() {
  const list = store.mine.map(s => ({ name: s.name, url: s.url, mine: true }));
  for (const s of mostVisited) {
    if (list.length >= MAX_TILES) break;
    if (s.url.startsWith(location.origin + location.pathname)) continue;   // (this page)
    if (store.hidden.some(h => sameSite(h, s.url)) || list.some(t => sameSite(t.url, s.url))) continue;
    list.push({ name: s.title || hostName(s.url), url: s.url, mine: false });
  }
  return list;
}
function letterColor(text) {
  let h = 0; for (const c of text) h = (h * 31 + c.codePointAt(0)) % 360;
  return 'hsl(' + h + ' 45% 42%)';
}
function iconFor(t) {
  const fav = document.createElement('span');
  fav.className = 'fav';
  const letter = () => { fav.textContent = (hostName(t.url)[0] || '?').toUpperCase(); fav.style.background = letterColor(hostName(t.url)); fav.style.color = '#fff'; };
  if (iconBase) {
    const img = new Image();
    img.alt = '';
    img.onerror = () => { img.remove(); letter(); };
    img.src = iconBase + '_favicon/?pageUrl=' + encodeURIComponent(t.url) + '&size=32';
    fav.append(img);
  } else letter();
  return fav;
}
function showShortcuts() {
  const box = document.getElementById('shortcut-row');
  box.textContent = '';
  const list = tiles();
  list.forEach((t, i) => {
    const tile = document.createElement('div');
    tile.className = 'tile';
    const a = document.createElement('a');
    a.href = t.url;
    a.title = t.name + '\n' + t.url;
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = t.name.slice(0, 40);
    a.append(iconFor(t), label);
    const more = document.createElement('button');
    more.type = 'button';
    more.className = 'more';
    more.textContent = '⋯';
    more.setAttribute('aria-label', 'Edit shortcut ' + t.name);
    more.addEventListener('click', () => openEditor(t));
    tile.append(a, more);
    box.append(tile);
  });
  if (store.mine.length < MAX_TILES) {
    const tile = document.createElement('div');
    tile.className = 'tile';
    const add = document.createElement('button');
    add.type = 'button';
    add.className = 'add';
    const fav = document.createElement('span');
    fav.className = 'fav';
    fav.textContent = '+';
    fav.setAttribute('aria-hidden', 'true');
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = 'Add shortcut';
    add.append(fav, label);
    add.addEventListener('click', () => openEditor(null));
    tile.append(add);
    if (list.length >= MAX_TILES) box.lastElementChild.replaceWith(tile); else box.append(tile);
  }
  document.getElementById('shortcuts').hidden = false;
}

// Add or edit a shortcut. A most-visited site that's edited becomes one of theirs; removed, it stays hidden.
let editing = null;
const dlg = document.getElementById('edit');
function openEditor(t) {
  editing = t;
  document.getElementById('edit-title').textContent = t ? 'Edit shortcut' : 'Add shortcut';
  document.getElementById('edit-name').value = t ? t.name : '';
  document.getElementById('edit-url').value = t ? t.url : '';
  document.getElementById('edit-error').textContent = '';
  document.getElementById('edit-remove').hidden = !t;
  dlg.showModal();
  document.getElementById(t ? 'edit-name' : 'edit-url').focus();
}
function forget(url) {
  store.mine = store.mine.filter(s => !sameSite(s.url, url));
  if (mostVisited.some(s => sameSite(s.url, url)) && !store.hidden.some(h => sameSite(h, url))) store.hidden.push(url);
}
document.getElementById('edit-form').addEventListener('submit', e => {
  e.preventDefault();
  let raw = document.getElementById('edit-url').value.trim();
  if (raw && !/^[a-z][a-z0-9+.-]*:/i.test(raw)) raw = 'https://' + raw;
  const url = webUrl(raw);
  if (!url || !/\./.test(new URL(url).hostname)) { document.getElementById('edit-error').textContent = 'Type a web address, like example.com.'; return; }
  const name = document.getElementById('edit-name').value.trim().slice(0, 40) || hostName(url);
  if (editing) {
    const i = store.mine.findIndex(s => sameSite(s.url, editing.url));
    if (i >= 0) store.mine[i] = { name, url };
    else { if (!sameSite(editing.url, url)) forget(editing.url); store.mine.push({ name, url }); }
  } else {
    if (!store.mine.some(s => sameSite(s.url, url))) store.mine.push({ name, url });
  }
  store.mine = store.mine.slice(0, MAX_TILES);
  store.hidden = store.hidden.filter(h => !sameSite(h, url));
  save(); dlg.close(); showShortcuts();
});
document.getElementById('edit-remove').addEventListener('click', () => { if (editing) { forget(editing.url); save(); } dlg.close(); showShortcuts(); });
document.getElementById('edit-cancel').addEventListener('click', () => dlg.close());

// The browser's most-visited sites, from the TLA New Tab extension where it's installed (again when the tab comes back).
function askDesktop() {   // (6.3; extension 1.1 and TLA BootPaper 6.3.5)
  try {
    if (!(window.chrome && chrome.runtime && chrome.runtime.sendMessage)) return;
    chrome.runtime.sendMessage(EXTENSION_ID, { type: 'background' }, reply => {
      void chrome.runtime.lastError;
      if (!reply || typeof reply.id !== 'string' || !/^[a-z0-9-]{1,40}$/.test(reply.id)) return;
      const d = { id: reply.id, look: reply.look === 'dark' ? 'dark' : reply.look === 'light' ? 'light' : '' };
      if (JSON.stringify(d) === JSON.stringify(desk)) return;
      desk = d;
      try { localStorage.setItem('tla-desk', JSON.stringify(d)); } catch (e) { }
      showPicture();
    });
  } catch (e) { }
}
function askMostVisited() {
  try {
    if (!(window.chrome && chrome.runtime && chrome.runtime.sendMessage)) return;
    chrome.runtime.sendMessage(EXTENSION_ID, { type: 'topSites' }, reply => {
      void chrome.runtime.lastError;   // (not installed: nothing to show)
      if (!reply || !Array.isArray(reply.sites)) return;
      mostVisited = reply.sites.filter(s => s && webUrl(s.url)).map(s => ({ title: String(s.title || '').slice(0, 80), url: webUrl(s.url) }));
      if (typeof reply.base === 'string' && /^(chrome-)?extension:\/\/[a-p]{32}\/$/.test(reply.base)) iconBase = reply.base;
      showShortcuts();
    });
  } catch (e) { }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { askMostVisited(); askDesktop(); } });
askDesktop();
showShortcuts();
askMostVisited();
tick();
</script>
