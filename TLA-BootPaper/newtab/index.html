<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; form-action https:; base-uri 'none'">
<title>New tab</title>
<link rel="icon" href="icon.png">
<!--
  The TLA new tab page (TLA BootPaper 5.0). Edge and Chrome open it for new tabs on TLA computers (a browser policy,
  NewTabPageLocation). It shows today's TLA background (the seasonal theme in season, otherwise a different one each
  day, in its dark look when the computer is in dark mode), the time, the TLA announcement (../linux/announcement.txt)
  and the links in links.json. Nothing is sent anywhere: it only reads files next to it.
-->
<style>
  :root {
    --navy: #0B1B33;
    --gold: #F2B830;
    --white: #FFFFFF;
    --ink-soft: rgba(11, 27, 51, 0.72);
    --glass: rgba(11, 27, 51, 0.46);
    --glass-edge: rgba(255, 255, 255, 0.18);
    --type: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "SF Pro Text", Ubuntu, Cantarell, "Noto Sans", sans-serif;
    --type-display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "SF Pro Display", Ubuntu, Cantarell, "Noto Sans", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--navy); color: var(--white); font-family: var(--type); -webkit-font-smoothing: antialiased; }

  .picture { position: fixed; inset: 0; background: var(--navy) center / cover no-repeat; opacity: 0; transition: opacity 600ms ease-out; }
  .picture.shown { opacity: 1; }
  /* Darker at the top and bottom, where the words are; the middle (the TLA logo in every picture) stays clear. */
  .scrim { position: fixed; inset: 0; pointer-events: none;
           background: linear-gradient(to bottom, rgba(8, 20, 38, 0.62) 0%, rgba(8, 20, 38, 0.18) 30%, rgba(8, 20, 38, 0) 45%,
                                       rgba(8, 20, 38, 0) 62%, rgba(8, 20, 38, 0.55) 100%); }

  main { position: relative; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto;
         padding: clamp(20px, 3.5vw, 44px); gap: 12px; }

  /* The top band: the time, search and the announcement. The middle (the TLA logo in every picture) stays clear. */
  header { display: grid; grid-template-columns: max-content minmax(280px, 1fr) minmax(220px, 380px); align-items: start; gap: 28px; }
  .notice { justify-self: end; }
  .time { margin: 0; font-family: var(--type-display); font-weight: 300; font-size: clamp(52px, 6.4vw, 96px); white-space: nowrap;
          line-height: 0.95; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; text-shadow: 0 2px 18px rgba(8, 20, 38, 0.45); }
  .hello { margin: 10px 0 0 4px; font-size: clamp(16px, 1.6vw, 20px); font-weight: 500; text-shadow: 0 1px 8px rgba(8, 20, 38, 0.6); }

  .notice { max-width: 380px; padding: 12px 16px 13px; border-radius: 10px; border-left: 3px solid var(--gold);
            background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3);
            font-size: 15px; line-height: 1.45; }
  .notice strong { display: block; color: var(--gold); font-size: 14px; margin-bottom: 2px; }
  .notice[hidden] { display: none; }

  form { justify-self: center; width: min(560px, 100%); margin-top: clamp(14px, 1.8vw, 26px); position: relative; }
  form svg { position: absolute; left: 19px; top: 50%; translate: 0 -50%; width: 20px; height: 20px; stroke: var(--ink-soft); }
  input[type=search] { width: 100%; height: 54px; padding: 0 22px 0 52px; border: 0; border-radius: 27px;
                       background: rgba(255, 255, 255, 0.94); color: var(--navy); font: 17px var(--type);
                       box-shadow: 0 10px 34px rgba(8, 20, 38, 0.35); }
  input[type=search]::placeholder { color: var(--ink-soft); }
  input[type=search]:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  nav { justify-self: center; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 10px 12px;
        border-radius: 22px; border: 1px solid var(--glass-edge); background: var(--glass);
        -webkit-backdrop-filter: blur(20px) saturate(1.3); backdrop-filter: blur(20px) saturate(1.3); }
  nav a { display: flex; flex-direction: column; align-items: center; gap: 7px; width: 104px; padding: 10px 4px 8px;
          border-radius: 14px; color: var(--white); text-decoration: none; font-size: 13px; line-height: 1.2; text-align: center; }
  nav a:hover { background: rgba(255, 255, 255, 0.12); }
  nav a:focus-visible { outline: 3px solid var(--gold); outline-offset: 0; }
  nav .ic { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 13px; background: rgba(255, 255, 255, 0.12); }
  nav svg { width: 24px; height: 24px; stroke: var(--gold); }

  .caption { position: fixed; right: clamp(14px, 2vw, 24px); bottom: 10px; margin: 0; font-size: 12px; opacity: 0.8;
             text-shadow: 0 1px 6px rgba(8, 20, 38, 0.8); }

  svg { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  @media (max-width: 1120px) {
    header { grid-template-columns: max-content minmax(0, 1fr); }
    form { grid-column: 1 / -1; grid-row: 2; justify-self: center; width: min(600px, 100%); margin-top: 0; }
  }
  @media (max-width: 640px) {
    header { grid-template-columns: 1fr; }
    .notice { justify-self: stretch; max-width: none; }
    form { grid-row: auto; }
    nav a { width: 84px; }
    .caption { position: static; text-align: center; }
  }
  @media (prefers-reduced-motion: reduce) { .picture { transition: none; } }
</style>
</head>
<body>
<div class="picture" id="picture" role="img" aria-label="Today's TLA background"></div>
<div class="scrim"></div>
<main>
  <header>
    <div>
      <p class="time" id="time">&nbsp;</p>
      <p class="hello" id="hello">&nbsp;</p>
    </div>
    <form id="search" role="search" method="get" action="https://www.bing.com/search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input type="search" name="q" id="q" placeholder="Search the web" aria-label="Search the web" autocomplete="off">
      <input type="hidden" name="adlt" value="strict">
    </form>
    <aside class="notice" id="notice" hidden><strong>From TLA</strong><span id="notice-text"></span></aside>
  </header>
  <div></div>
  <nav id="links" aria-label="School links"></nav>
</main>
<p class="caption" id="caption"></p>

<script>
'use strict';
// The same backgrounds and light/dark pictures as TLA BootPaper. VARIANTS: the look of each background's extra picture.
const BACKGROUNDS = [['microsoft', 'Microsoft'], ['liquid-glass', 'Liquid Glass'], ['penguins', 'Penguins'], ['code', 'Code'],
  ['frutiger-aero', 'Frutiger Aero'], ['solarpunk', 'Solarpunk'], ['rainy', 'Rainy'], ['space', 'Space'], ['ocean', 'Underwater'],
  ['claymation', 'Claymation'], ['blocks', 'Blocks'], ['bricks', 'Bricks'], ['pixel', '8-Bit'], ['anime', 'Anime'],
  ['sky-city', 'Sky City'], ['tla', 'TLA Classic']];
const SEASONS = { fall: 'Fall', christmas: 'Christmas', easter: 'Easter' };
const VARIANTS = { microsoft: 'dark', 'liquid-glass': 'dark', 'frutiger-aero': 'dark', solarpunk: 'dark', rainy: 'dark',
  claymation: 'dark', blocks: 'dark', bricks: 'dark', pixel: 'dark', anime: 'dark', 'sky-city': 'dark', tla: 'dark',
  penguins: 'light', code: 'light', space: 'light', fall: 'dark', christmas: 'dark', easter: 'dark' };
const DEFAULT_LINKS = {
  search: { placeholder: 'Search the web', action: 'https://www.bing.com/search', params: { adlt: 'strict' } },
  links: [
    { name: 'TLA Hub', url: 'https://hub.schoolathome.ca/', icon: 'hub' },
    { name: 'Email', url: 'https://outlook.office.com/mail/', icon: 'mail' },
    { name: 'Teams', url: 'https://teams.microsoft.com/', icon: 'chat' },
    { name: 'OneDrive', url: 'https://www.microsoft365.com/onedrive', icon: 'cloud' },
    { name: 'Microsoft 365', url: 'https://www.microsoft365.com/', icon: 'apps' },
    { name: 'Helpdesk', url: 'mailto:helpdesk@schoolathome.ca', icon: 'help' }]
};
const ICONS = {
  hub: '<path d="M3 10.5 12 4l9 6.5"/><path d="M5.5 9v10h13V9"/><path d="M10 19v-5h4v5"/>',
  mail: '<rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="m3.5 7 8.5 6 8.5-6"/>',
  chat: '<path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H10l-5 4v-4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/>',
  cloud: '<path d="M7.5 18.5h9.5a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.2 9.6a4.5 4.5 0 0 0 1.3 8.9z"/>',
  apps: '<rect x="4" y="4" width="6" height="6" rx="1.2"/><rect x="14" y="4" width="6" height="6" rx="1.2"/><rect x="4" y="14" width="6" height="6" rx="1.2"/><rect x="14" y="14" width="6" height="6" rx="1.2"/>',
  help: '<circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.4"/><path d="M12 17h.01"/>',
  book: '<path d="M5 4.5h12.5v15H6.5A1.5 1.5 0 0 1 5 18z"/><path d="M5 18a1.5 1.5 0 0 1 1.5-1.5h11"/>',
  calendar: '<rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/>',
  video: '<rect x="3" y="6.5" width="12.5" height="11" rx="2"/><path d="m15.5 10.5 5-3v9l-5-3"/>',
  link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'
};

// ---- today's picture ----
function easterSunday(y) {   // (the Anonymous Gregorian algorithm, as in TLA BootPaper)
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, g = Math.floor((8 * b + 13) / 25);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 19 * l) / 433), month = Math.floor((h + l - 7 * m + 90) / 25);
  return new Date(y, month - 1, (h + l - 7 * m + 33 * month + 19) % 32);
}
function season(d) {   // Fall Sep 22 - Nov 30, Christmas Dec 1 - Jan 6, Easter two weeks before Easter Sunday to Easter Monday
  const mo = d.getMonth() + 1, day = d.getDate();
  if ((mo === 9 && day >= 22) || mo === 10 || mo === 11) return 'fall';
  if (mo === 12 || (mo === 1 && day <= 6)) return 'christmas';
  const e = easterSunday(d.getFullYear()), t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  if (t >= new Date(e.getFullYear(), e.getMonth(), e.getDate() - 14) && t <= new Date(e.getFullYear(), e.getMonth(), e.getDate() + 1)) return 'easter';
  return null;
}
function todaysBackground(d) {
  const s = season(d);
  if (s) return [s, SEASONS[s] + ' theme'];
  const dayNumber = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  return BACKGROUNDS[dayNumber % BACKGROUNDS.length];
}
const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
function pictureFile(id) {
  const look = darkQuery.matches ? 'dark' : 'light';
  return 'pictures/' + (VARIANTS[id] === look ? id + '-' + look : id) + '.jpg';
}
let shownFile = '';
function showPicture() {
  const [id, name] = todaysBackground(new Date());
  const file = pictureFile(id);
  if (file === shownFile) return;
  const img = new Image();
  img.onload = () => {
    const el = document.getElementById('picture');
    el.style.backgroundImage = 'url("' + file + '")';
    el.classList.add('shown');
    shownFile = file;
    document.getElementById('caption').textContent = "Today's picture: " + name;
  };
  img.onerror = () => { if (id !== 'tla') { shownFile = file; document.getElementById('picture').style.backgroundImage = 'url("pictures/tla.jpg")';
                                            document.getElementById('picture').classList.add('shown'); } };
  img.src = file;
}
darkQuery.addEventListener('change', showPicture);

// ---- the time ----
function tick() {
  const now = new Date(), h = now.getHours();
  document.getElementById('time').textContent = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const part = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  document.getElementById('hello').textContent = part + '! It’s ' +
    now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' }) + '.';
  showPicture();   // (a new day brings a new picture)
  setTimeout(tick, 60000 - now.getSeconds() * 1000 - now.getMilliseconds() + 50);
}

// ---- the announcement (the same text as on the Linux login screen) ----
function cleanAnnouncement(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l && !l.startsWith('#'));
  return Array.from(lines.join(' ')).filter(c => c >= ' ').join('').slice(0, 300).trim();
}
fetch('../linux/announcement.txt', { cache: 'no-cache' })
  .then(r => r.ok ? r.text() : '')
  .then(t => { const a = cleanAnnouncement(t || ''); if (a) { document.getElementById('notice-text').textContent = a; document.getElementById('notice').hidden = false; } })
  .catch(() => {});

// ---- links and search ----
const safeUrl = u => typeof u === 'string' && /^(https:\/\/|mailto:)/i.test(u);
function showLinks(cfg) {
  const nav = document.getElementById('links');
  nav.textContent = '';
  (Array.isArray(cfg.links) ? cfg.links : DEFAULT_LINKS.links)
    .filter(l => l && typeof l.name === 'string' && safeUrl(l.url)).slice(0, 8)
    .forEach(l => {
      const a = document.createElement('a');
      a.href = l.url;
      const ic = document.createElement('span');
      ic.className = 'ic';
      ic.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[l.icon] || ICONS.link) + '</svg>';   // (built-in icons only)
      const name = document.createElement('span');
      name.textContent = l.name.slice(0, 30);
      a.append(ic, name);
      nav.append(a);
    });
  const s = cfg.search || {};
  const form = document.getElementById('search');
  if (safeUrl(s.action) && s.action.startsWith('https://')) {
    form.action = s.action;
    form.querySelectorAll('input[type=hidden]').forEach(i => i.remove());
    Object.entries(s.params || {}).forEach(([k, v]) => {
      const i = document.createElement('input');
      i.type = 'hidden'; i.name = String(k); i.value = String(v);
      form.append(i);
    });
  }
  if (typeof s.placeholder === 'string') {
    document.getElementById('q').placeholder = s.placeholder;
    document.getElementById('q').setAttribute('aria-label', s.placeholder);
  }
}
showLinks(DEFAULT_LINKS);
fetch('links.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).then(c => c && showLinks(c)).catch(() => {});
tick();
</script>
</body>
</html>
