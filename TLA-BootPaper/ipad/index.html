<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Welcome to TLA for iPads (5.9.5): the tour from TLA BootPaper on Macs, made for iPads. Intune puts it on the Home
     Screen as a web clip ("Welcome to TLA", full screen), so it opens like an app, with no Safari bars. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Welcome to TLA">
<meta name="theme-color" content="#0B1B33">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Welcome to TLA</title>
<style>
  :root {
    --navy: #0B1B33;
    --gold: #F2B830;
    --text: #FFFFFF;
    --soft: rgba(255, 255, 255, 0.9);
    --faint: rgba(255, 255, 255, 0.72);
    --type: -apple-system, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
    --type-display: -apple-system, "SF Pro Display", system-ui, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--navy) url("tour-background.jpg") center / cover no-repeat fixed;
    color: var(--text); font-family: var(--type);
    -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    overflow: hidden; touch-action: pan-y;
  }
  /* Like the Mac's tour: the picture, darker where the words are. */
  .shade { position: fixed; inset: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(8, 20, 38, 0.6) 0%, rgba(8, 20, 38, 0.35) 55%, rgba(8, 20, 38, 0.15) 100%); }
  .tour { position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: max(28px, env(safe-area-inset-top)) max(40px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(56px, env(safe-area-inset-left)); }
  .top { display: flex; align-items: center; gap: 12px; }
  .top img { width: 32px; height: 32px; border-radius: 8px; }
  .kicker { font-weight: 700; font-size: 14px; letter-spacing: 0.08em; color: var(--gold); flex: 1; }
  .skip { font: inherit; font-size: 16px; color: var(--soft); background: none; border: 0; padding: 12px 6px; cursor: pointer; }
  .middle { flex: 1; display: flex; align-items: center; }
  /* The words on a pane of frosted glass, so the picture behind never gets in the way. */
  .page { max-width: 640px; padding: 34px 38px 30px; border-radius: 30px;
    background: rgba(8, 20, 38, 0.58); -webkit-backdrop-filter: blur(26px) saturate(1.3); backdrop-filter: blur(26px) saturate(1.3);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16), 0 20px 50px rgba(0, 0, 0, 0.3); }
  .page p:last-of-type { margin-bottom: 0; }
  h1 { font-family: var(--type-display); font-size: clamp(32px, 4.6vw, 46px); line-height: 1.12; margin: 0 0 16px; font-weight: 700; text-wrap: balance; }
  .page p { font-size: clamp(18px, 2.2vw, 21px); line-height: 1.5; color: var(--soft); margin: 0 0 14px; text-wrap: pretty; }
  .extra { margin-top: 22px; }
  .looks { display: flex; gap: 22px; }
  .look { margin: 0; }
  .look img { display: block; width: 150px; height: 200px; object-fit: cover; border-radius: 14px;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35), 0 10px 30px rgba(0, 0, 0, 0.35); }
  .look figcaption { margin-top: 8px; font-size: 15px; color: var(--faint); text-align: center; }
  .link { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px; font-size: 17px; font-weight: 600;
    color: var(--text); text-decoration: none; background: rgba(255, 255, 255, 0.16); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.4); }
  .bottom { display: flex; align-items: center; gap: 14px; }
  .dots { display: flex; gap: 8px; flex: 1; }
  .dots span { width: 8px; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.35); transition: width 0.2s, background 0.2s; }
  .dots span.on { width: 22px; background: var(--gold); }
  .btn { font: inherit; font-size: 18px; font-weight: 600; min-height: 50px; min-width: 112px; padding: 0 26px; border-radius: 999px; border: 0; cursor: pointer; }
  .btn.back { background: rgba(255, 255, 255, 0.14); color: var(--text); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35); }
  .btn.next { background: #FFFFFF; color: var(--navy); }
  .btn:active, .link:active { transform: scale(0.97); }
  .page { animation: rise 0.35s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .page { animation: none; } .dots span { transition: none; } }
  /* An iPad held upright: words at the bottom, over a darker band. */
  @media (orientation: portrait) {
    .shade { background: linear-gradient(180deg, rgba(8, 20, 38, 0.1) 0%, rgba(8, 20, 38, 0.3) 50%, rgba(8, 20, 38, 0.6) 100%); }
    .page { max-width: none; width: 100%; }
    .tour { padding-left: max(32px, env(safe-area-inset-left)); padding-right: max(32px, env(safe-area-inset-right)); }
    .middle { align-items: flex-end; padding-bottom: 28px; }
  }
</style>
</head>
<body>
<div class="shade"></div>
<main class="tour">
  <div class="top">
    <img src="apple-touch-icon.png" alt="">
    <div class="kicker">WELCOME TO TLA</div>
    <button class="skip" id="skip" type="button">Skip the tour</button>
  </div>
  <div class="middle"><section class="page" id="page" aria-live="polite"></section></div>
  <div class="bottom">
    <div class="dots" id="dots" aria-hidden="true"></div>
    <button class="btn back" id="back" type="button">Back</button>
    <button class="btn next" id="next" type="button">Next</button>
  </div>
</main>
<script>
'use strict';
const HELPDESK = 'helpdesk@schoolathome.ca';
const START_PAGE = 'https://ebuskell-source.github.io/Default-wallpaper/TLA-BootPaper/newtab/';
const HUB = 'https://hub.schoolathome.ca/';
// Each page: a heading, its words, and anything extra under them (trusted HTML written here, nothing from outside).
const PAGES = [
  { id: 'welcome', h: 'Welcome to TLA!',
    p: ['This iPad is all set up for you. Here’s a quick look at what makes it yours. It takes about a minute.'] },
  { id: 'look', h: 'Your TLA look',
    p: ['Your Lock Screen shows Liquid Glass in its dark look, and your Home Screen in its light look. They stay that way, so your iPad always looks like TLA.'],
    extra: '<div class="looks"><figure class="look"><img src="preview-lock.jpg" alt="Liquid Glass, dark"><figcaption>Lock Screen</figcaption></figure>' +
           '<figure class="look"><img src="preview-home.jpg" alt="Liquid Glass, light"><figcaption>Home Screen</figcaption></figure></div>' },
  { id: 'news', h: 'News from TLA',
    p: ['When TLA has something to tell everyone, like a day off or an event, you’ll see it at the bottom of your Lock Screen.'] },
  { id: 'start', h: 'Your TLA start page',
    p: ['Today’s TLA picture, the time, and quick links to the TLA Hub, your email and more, all in one place.'],
    extra: '<a class="link" href="' + START_PAGE + '" target="_blank" rel="noopener">Open the start page</a>' },
  { id: 'lock', h: 'Keep your iPad to yourself',
    p: ['Your passcode keeps your schoolwork safe. Don’t share it with anyone except your family.',
        'Stepping away? Press the top button to lock your iPad.'] },
  { id: 'help', h: 'Help is one tap away',
    p: ['Something not working on your iPad? Email the TLA helpdesk and say what’s wrong. They’ll help you sort it out.'],
    extra: '<a class="link" href="mailto:' + HELPDESK + '?subject=' + encodeURIComponent('Help with my iPad') + '">Email ' + HELPDESK + '</a>' },
  { id: 'done', h: 'You’re all set!',
    p: ['Have a great year. You can take this tour again any time: tap Welcome to TLA on your Home Screen.',
        'To get back to your Home Screen, swipe up from the bottom edge.'],
    extra: '<a class="link" href="' + HUB + '" target="_blank" rel="noopener">Open the TLA Hub</a>' },
];
let at = 0;
const $ = id => document.getElementById(id);
function show() {
  const pg = PAGES[at];
  const el = $('page');
  el.textContent = '';
  const h = document.createElement('h1'); h.textContent = pg.h; el.appendChild(h);
  pg.p.forEach(t => { const p = document.createElement('p'); p.textContent = t; el.appendChild(p); });
  if (pg.extra) { const x = document.createElement('div'); x.className = 'extra'; x.innerHTML = pg.extra; el.appendChild(x); }
  el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  $('dots').innerHTML = PAGES.map((_, i) => '<span' + (i === at ? ' class="on"' : '') + '></span>').join('');
  $('back').style.visibility = at === 0 ? 'hidden' : 'visible';
  $('next').textContent = at === 0 ? 'Let’s go' : at === PAGES.length - 1 ? 'Start again' : 'Next';
  $('skip').style.visibility = at === PAGES.length - 1 ? 'hidden' : 'visible';
}
function go(d) { at = Math.max(0, Math.min(PAGES.length - 1, at + d)); show(); }
$('next').addEventListener('click', () => { if (at === PAGES.length - 1) { at = 0; show(); } else go(1); });
$('back').addEventListener('click', () => go(-1));
$('skip').addEventListener('click', () => { at = PAGES.length - 1; show(); });
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); });
// A swipe left or right turns the page.
let x0 = null, y0 = null;
document.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
document.addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
  x0 = y0 = null;
}, { passive: true });
show();
</script>
</body>
</html>
