name: bootpaper-tests
on:
  push:
    branches: [ci/bootpaper-tests]
permissions:
  contents: write
jobs:
  mac-605:
    if: contains(github.event.head_commit.message, '[mac-605]')
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/mac-605-test.sh
      - name: results
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b r && git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm "mac 6.0.5 ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:ci/results-mac-605
  mac-open:
    if: contains(github.event.head_commit.message, '[mac-open]')
    runs-on: macos-latest
