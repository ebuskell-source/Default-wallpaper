name: bootpaper-tests
on:
  push:
    branches: [ci/bootpaper-tests]
permissions:
  contents: write
jobs:
  mac-player:
    if: contains(github.event.head_commit.message, '[mac-player]')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/mac-player-test.sh
      - name: results
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b r && git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm "mac player ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:ci/results-mac-player
  mac-app:
    if: contains(github.event.head_commit.message, '[mac-app]')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/mac-app-test.sh
      - name: results
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b r && git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm "mac app ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:ci/results-mac-app
  win:
    if: contains(github.event.head_commit.message, '[win]')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: ./ci/win-test.ps1
      - name: results
        if: always()
        shell: bash
        run: |
          cd out && git init -q && git checkout -q -b r && git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm "win ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:ci/results-win
  mac-signin:
    if: contains(github.event.head_commit.message, '[mac-signin]')
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/mac-signin-test.sh
      - name: results
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b r && git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm "mac signin ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:ci/results-mac-signin
  win-signin:
    if: contains(github.event.head_commit.message, '[win-signin]')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: ./ci/win-signin-test.ps1
      - name: results
        if: always()
        shell: bash
        run: |
          cd out && git init -q && git checkout -q -b r && git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm "win signin ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:ci/results-win-signin
  oidc:
    if: contains(github.event.head_commit.message, '[oidc]')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: claims
        run: |
          mkdir -p out
          t="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')"
          printf '%s' "$t" | cut -d. -f2 | python3 -c 'import sys,base64,json; s=sys.stdin.read().strip(); s+="="*(-len(s)%4); d=json.loads(base64.urlsafe_b64decode(s)); print(json.dumps({k: d.get(k) for k in ("sub","iss","aud","repository","repository_id","repository_owner_id","ref")}, indent=1))' > out/claims.json
          cat out/claims.json
      - name: results
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b r && git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm "oidc ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:ci/results-oidc
  mac58:
    if: contains(github.event.head_commit.message, '[mac-58]')
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/mac-58-test.sh
      - name: results
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b r && git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm "mac 5.8.0 ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:ci/results-mac-58
  win58:
    if: contains(github.event.head_commit.message, '[win-58]')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: ./ci/win-58-test.ps1
      - name: results
        if: always()
        shell: bash
        run: |
          cd out && git init -q && git checkout -q -b r && git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm "win 5.8.0 ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:ci/results-win-58
