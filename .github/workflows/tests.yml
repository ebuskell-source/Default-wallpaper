          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:ci/results-mac-app
  win:
    if: contains(github.event.head_commit.message, '[win]')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: ./ci/win-test.ps1
      - name: results
        if: always()
