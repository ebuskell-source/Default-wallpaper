name: bootpaper-tests
on:
  push:
    branches: [ci/bootpaper-tests]
permissions:
  contents: write
jobs:
  mac-care:
    if: contains(github.event.head_commit.message, '[mac-care]')
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/mac-care-test.sh
      - name: results
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b r && git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm "care ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:ci/results-mac-care
