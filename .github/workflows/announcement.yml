# TLA BootPaper (5.8.0): copies the announcement from Intune into TLA-BootPaper/{mac,linux,windows}/announcement.txt,
# for the computers that read it from here. See .github/copy-announcement.py. No secrets: it signs in to Microsoft with
# GitHub's own token for this repository's main branch (a federated credential on the Entra app below).
name: announcement
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: announcement
  cancel-in-progress: false
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Copy from Intune
        env:
          ANNOUNCE_CLIENT_ID: '3cc89f88-c4a4-4ec3-bf85-e103e8d297b4'   # "TLA BootPaper Announcement Copy" (an ID, not a secret)
        run: python3 .github/copy-announcement.py
      - name: Save
        run: |
          git config user.name 'TLA BootPaper'
          git config user.email 'tla-bootpaper@users.noreply.github.com'
          git add TLA-BootPaper/mac/announcement.txt TLA-BootPaper/linux/announcement.txt TLA-BootPaper/windows/announcement.txt
          if git diff --cached --quiet; then echo 'No change.'; exit 0; fi
          git commit -q -m 'Announcement copied from Intune'
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
          exit 1
